approval.description.FULL_CONTROL=Every command passes static checks and independent AI review before execution; human command review is not required.
authorization.description.MANUAL_REVIEW.ONCE=Authorize each reviewed command separately. Full authorization is unavailable with manual review.
authorization.description.MANUAL_REVIEW.GENERAL=Authorize reviewed ordinary commands within this task's confirmed scope; HIGH-risk commands still require explicit authorization.
authorization.description.AUTOMATIC.ONCE=Authorize each reviewed command separately. A refused HIGH-risk command needs a newly reviewed non-HIGH alternative; stop if no alternative exists.
authorization.description.AUTOMATIC.GENERAL=Authorize ordinary commands within this task's confirmed scope. A refused HIGH-risk command needs a newly reviewed non-HIGH alternative; stop if no alternative exists.
authorization.description.AUTOMATIC.FULL=Do not prompt for HIGH-risk authorization or execute an unauthorized HIGH-risk command. Find a non-HIGH alternative and run fresh static and AI review; stop if none exists.
authorization.description.FULL_CONTROL.GENERAL=Confirm one task handoff before executing commands that pass both review gates.
authorization.description.FULL_CONTROL.FULL=Execute commands that pass static and AI review without an authorization handoff.
