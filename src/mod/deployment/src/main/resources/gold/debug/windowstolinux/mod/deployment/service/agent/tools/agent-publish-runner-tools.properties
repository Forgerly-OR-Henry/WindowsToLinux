command=Reviewed host publication script: {script,seconds,reason}; seconds is 1..7200 and state.staged must be true. Assess ALL current state.judgement.pending IDs first; select one critical call per response.
stage=Stage exact configuration and protected secret revisions before custom activation; {}. Assess ALL current state.judgement.pending IDs first; select one critical call per response.
publish=Ordered whole-graph transaction that stages its own exact inputs, checks health and rolls back known failure; no task completion; {}. Available only before state.standardSent becomes true. Assess ALL current state.judgement.pending IDs first; select one critical call per response.
unable=Retain unfinished publication: {reason}
verify=Independently attest exact release identity and component/application health; {}. Assess ALL current state.judgement.pending IDs first, including actual publish feedback; select one critical call per response.
finish=Commit and clean only after assessment of latest successful verify; {}. Assess ALL current state.judgement.pending IDs first; select one critical call per response.
finish_failure=Accept only this native FAILED publication after its complete verified rollback: {reason}. Assess ALL current pending observations first, in a response after the actual failure feedback. Post-publication staging or custom host commands, unresolved effects or changed bindings make this unavailable. Unchanged known ENDED commands from before native publication may be retained. The original task ends FAILED only after independently authorized cleanup and release; this neither creates a successor nor finishes the deployment goal.
contract=Read only an enumerated lifecycle/schema contract: {path,offset,limit}; offset is a zero-based line in 0..1000000, limit is 1..100. Complete JSON page includes totalLines, nextLine, hasMore, returnedLines and lines; continue unread tail at nextLine only when hasMore=true. An observation query cannot read the file tail. Already-read ranges and original IDs are in state.judgement.contractPages.
input=Request missing nonsecret intent: {question}

continue_deployment=Accept the exact current native FAILED and fully restored attempt, then request an independent serial successor for the same source, application and target. Requires complete original settlement, a bounded verified source capsule, unchanged explicit no-database or supported unseeded SQLite bindings without external initialization or secrets, and remaining original goal budgets. Original task remains FAILED; this does not replay a proposal or attest successor success.
