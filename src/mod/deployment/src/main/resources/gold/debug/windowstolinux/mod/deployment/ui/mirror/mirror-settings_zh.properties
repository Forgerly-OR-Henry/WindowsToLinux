description=按下载用途配置来源。固定来源按优先级尝试；自动匹配会尝试适用的地区镜像和官方来源。修改仅对新任务生效。
privacy.title=地区匹配隐私说明
privacy.text=启用后，软件将检测目标服务器的出口公网 IP，并在本地判断国家或地区，用于匹配镜像源。地区识别不会读取服务器文件、项目内容或业务数据。必要时会访问外部 IP 检测服务，该服务可见服务器的公网 IP。
