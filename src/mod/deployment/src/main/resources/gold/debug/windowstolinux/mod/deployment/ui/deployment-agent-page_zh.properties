approval.MANUAL_REVIEW=人工审阅
approval.AUTOMATIC=自动审批
approval.FULL_CONTROL=完全控制
authorization=授权策略
authorization.ONCE=单次授权
authorization.GENERAL=通用授权
authorization.FULL=完全授权
approval.description.MANUAL_REVIEW=每条命令先过静态检查和独立 AI 审批，再逐条人工审阅。
approval.description.AUTOMATIC=每条命令先过静态检查和独立 AI 审批，仅 HIGH 风险命令需要人工审阅。
approval.description.FULL_CONTROL=每条命令先过静态检查和独立 AI 审批，通过后执行，无需逐条人工审阅。
authorization.description.MANUAL_REVIEW.ONCE=逐条授权经审阅的命令；人工审批不能选择完全授权。
authorization.description.MANUAL_REVIEW.GENERAL=在本任务已确认范围内通用授权经审阅的普通命令；HIGH 风险命令仍需明确授权。
authorization.description.AUTOMATIC.ONCE=逐条授权经审阅的命令。HIGH 命令未获授权时，寻找并重新审阅非 HIGH 替代方案；无方案则停止。
authorization.description.AUTOMATIC.GENERAL=在本任务已确认范围内通用授权普通命令。HIGH 命令未获授权时，寻找并重新审阅非 HIGH 替代方案；无方案则停止。
authorization.description.AUTOMATIC.FULL=不弹 HIGH 授权，也不执行未获授权的 HIGH 命令。寻找非 HIGH 替代方案，并重新通过静态和 AI 审批；无方案则停止。
authorization.description.FULL_CONTROL.GENERAL=任务开始时确认一次交接，随后执行通过静态和 AI 审批的命令。
authorization.description.FULL_CONTROL.FULL=无需授权交接，执行通过静态和 AI 审批的命令。
