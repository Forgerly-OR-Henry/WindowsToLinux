environment.confirm=managed service environment preparation will run only against this saved target:\nServer identifier: {serverId}\nHost: {host}:{port}\nSSH user: {username}\n\nThe program first verifies Ubuntu 24.04, x86_64, and systemd, then runs:\n1. apt-get update\n2. apt-get install -y --no-install-recommends for:\n   openjdk-21-jdk-headless, maven, curl, sudo, tar, gzip, iproute2,\n   coreutils, util-linux, findutils, gawk\n3. Install the root-owned managed-deployment controlled helper and write and verify\n   /etc/sudoers.d/windowstolinux-managed. The rule permits only that fixed helper,\n   which accepts only managed-deployment managed candidate, publish, rollback, retention,\n   and lifecycle operations. Capabilities are collected again afterward.\n\nThis changes the remote system and requires network access to Ubuntu repositories.\nA root user may start from a bare system; a regular user must already have non-interactive sudo or the operation fails safely. Source is not uploaded, built, or published.\nAllow WindowsToLinux to perform these fixed operations?
environment.preparing=WindowsToLinux is preparing the managed-deployment target environment. Source will not be uploaded, built, or published…
