settings.credentials.title=Platform credentials
settings.credentials.body=SSH and AI credentials may use master-password encryption or Windows Credential Manager. Master passwords and API keys are never written to ordinary SQLite fields.
settings.boundary.title=managed service boundary
settings.boundary.body=The desktop performs static reads, controlled archiving, and high-level deployment operations only. It does not manage arbitrary units, offer remote deletion, or store application secrets.
settings.usage.title=Usage guidance
settings.usage.body=Analyze source, confirm the server fingerprint, and inspect target capabilities before deployment. The program stops if a fingerprint changes, ownership differs, or a remote result cannot be verified.
settings.appearance.title=Language and appearance
settings.appearance.body=Preferences are stored locally. Changes update the current window immediately without writing credentials or deployment data.
