help.field.healthMode=The home page detects this from source; manual components require an explicit choice. Override with HTTP for web endpoints or TCP for listening ports. A mismatch prevents release.
help.field.healthEndpoint=For HTTP enter the server-side URL; for TCP enter the listening port. Automatic deployment uses the project port and local root path when blank; manual components require a value. Change to match the actual listener; failed checks prevent release.
help.field.expectedStatus=Expected HTTP response code, normally 200. Change only if the health endpoint returns another success code.
help.field.timeout=Seconds allowed for a health check: 10 on the home page, 20 in the manual editor. Increase for slow startup; a short timeout may reject a healthy service.
help.field.tcpStability=Seconds the TCP port must remain stable: 5 on the home page, 1 in the manual editor. Increase for unstable startup to avoid mistaking a briefly opened port for success.
help.field.userAccessUrl=URL people use after deployment. Automatic HTTP deployment uses the server address and project port when blank; change for a domain or reverse proxy. Manual HTTP components require a value. Leave blank for TCP.
help.field.projectType=The application type. Normally detected from source; choose when several deployment methods are possible.
help.field.runtimePrimary=Primary runtime value, such as a JAR path, Python version or static output folder. Prefer the detected value.
help.field.runtimeSecondary=Runtime entry, such as a Java main class or Python module. Leave blank for types that do not need it.
help.field.runtimeVersion=Runtime version required by the project. Prefer the declared version over an arbitrary latest version.
help.field.jvmArguments=Java VM options, such as memory limits. Leave blank unless required; use the supported argument format.
help.field.applicationArguments=Arguments passed to the application, not an arbitrary shell command. Leave blank if unnecessary.
help.field.containerEngine=For container projects only; defaults to Podman. Change when Docker is required and supported by the server; its daemon risk needs separate confirmation.
help.field.containerPorts=Host-to-container port mappings, for example 8080:80. Ports must match the service and must not conflict.
help.field.containerVolumes=Managed persistent volume mappings. Leave blank if unnecessary; arbitrary server paths are not allowed.
help.field.configurationEntries=Non-secret configuration, for example PORT=8080. Use secret references for passwords. Blank preserves project defaults.
help.field.databaseReviewMode=Defaults to unreviewed: the home page continues automatic source-based DB management; manual components require a review. Select an engine for an explicit connection, or none for no DB. Source-declared databases cannot be omitted.
help.field.databaseDetails=Existing database location, name, user and secret reference. Leave blank for automatic management or no DB; follow the displayed format for a manual binding. A wrong location prevents connection. Never enter a plain-text password.
help.field.secretReferences=Saved secret identifiers and revisions. Leave blank when no additional secrets are needed; use references for secret injection. A wrong revision prevents deployment. Never enter passwords, tokens or private keys.
help.field.secretRevision=Save an application password securely and obtain a reference. Use only when the application needs secret configuration.
help.experimentalAdapterRisk=Allows an experimental runtime adapter. Off by default; use only in a test environment within its supported scope.

