environment.confirm=将仅对以下已保存目标执行受管部署环境准备：\n服务器标识：{serverId}\n主机：{host}:{port}\nSSH 用户：{username}\n\n程序会先核验 Ubuntu 24.04、x86_64 与 systemd，然后执行：\n1. apt-get update\n2. apt-get install -y --no-install-recommends：\n   openjdk-21-jdk-headless、maven、curl、sudo、tar、gzip、iproute2、\n   coreutils、util-linux、findutils、gawk\n3. 安装 root-owned 的受管部署受控助手，并写入和校验受限\n   /etc/sudoers.d/windowstolinux-managed；该规则仅允许调用该固定助手，\n   它只接受受管部署受管的候选、发布、回滚、保留和生命周期高层操作；随后重新采集能力。\n\n这会改变远端系统并需要 Ubuntu 软件源网络可用。root 用户可从裸机开始；\n普通用户必须已有无交互 sudo，否则程序会安全失败。不会上传源码、构建或发布应用。\n确认由 WindowsToLinux 执行上述固定操作？
