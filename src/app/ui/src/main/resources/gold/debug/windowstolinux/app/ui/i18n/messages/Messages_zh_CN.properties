db.help.engine=选择项目要求的数据库类型；程序不会自动换成另一种引擎。
db.help.database=已有库请填实际名称，新库可使用生成的专用名称。Redis 中此项为应用的键前缀，应用写入的键必须使用该前缀。
db.help.username=填写应用使用的账号。只有创建新的应用数据库时，才创建专用账号；复用已有库不会重置账号。
db.help.environmentPrefix=程序实际读取的变量前缀，例如 DB 或 SPRING_DATASOURCE。自动提供 HOST、PORT、DATABASE、USERNAME；Spring 使用 JDBC URL。
db.help.passwordEnvironment=应用读取密码的变量，例如 DB_PASSWORD。系统运行方式在启动时读取受保护的凭据；容器必须明确支持 DB_PASSWORD_FILE 等文件变量。
db.help.initialize=选择在新建且确认为空的应用库中执行一次的 SQL 文件。已有库另行确认结构变更；失败会记录，重试不会盲目重复执行。
db.help.instance=选择要复用的已有实例。选项包含实例标识、版本和端口；服务停止也属于已安装，不能据此重复安装。
backup.inputs.missing.unsupported_database_backup=Redis 或绑定多个数据库的应用暂不支持完整备份。
