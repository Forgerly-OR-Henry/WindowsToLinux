help.backup.field.masterPassword=用于解锁已加密保存的凭据。使用 Windows 凭据存储时可留空，此密码不会写入备份。
help.component.field.applicationRoot=包含全部组件源码的根目录，无默认值。编辑或移动源码时填写实际目录，后续相对路径均从这里计算。
help.component.field.applicationId=整应用的稳定小写标识，无默认值且不能留空。首次编辑时填写；更改后会被视为另一个应用。
help.component.field.id=组件的唯一标识，无默认值且不能留空。首次添加时填写，供依赖和健康检查引用；改名后须同步引用。
help.component.field.relativeRoot=组件相对于整应用根目录的位置，无默认值。根目录组件填写一个点；目录移动后需修改，否则可能选错源码。
help.component.field.healthOwner=代表整应用健康状态的组件，无默认值，需填写已有组件标识。入口变化时调整；其他必要组件仍须通过检查。
help.component.field.runtimeAdditional=当前运行方式专用的补充参数；无特殊要求时保持为空。
help.component.field.artifacts=明确的构建产物路径，相对于组件目录，无默认值。按构建输出填写，位置变化时调整；用于限定可发布的内容。
help.component.field.ports=该组件占用的端口，无默认值。按实际监听端口填写，端口变化时调整；部署前据此检查冲突。
help.component.field.dependencies=必须先启动的组件标识；留空表示独立组件，循环依赖会被拒绝。
