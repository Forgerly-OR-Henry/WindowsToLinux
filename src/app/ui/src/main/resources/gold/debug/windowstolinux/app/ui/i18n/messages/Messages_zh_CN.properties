advanced.help=这里可以调整运行环境、连接和检查方式。一般保持默认即可；收起不会清除你填写的内容。
help.field.serverId=服务器的本地名称，用来区分保存的连接。请为不同服务器使用不同名称，避免覆盖已有连接。
help.field.sshPort=连接服务器使用的 SSH 端口，默认 22。只有服务器修改过 SSH 端口时才需要更改。
help.field.credentialStorage=决定密码保存在哪里。默认使用 Windows 凭据管理器；选择主密码加密后，每次需要解锁才能连接。
help.field.masterPassword=仅在使用主密码加密存储时填写，用于解锁已保存的秘密。这不是服务器密码，也不会发送到服务器或 AI。
help.field.aiProviderId=给这组 AI 接口起一个名称。默认用于项目分析，只有配置多个服务时才需要区分。
help.field.aiRole=决定哪些问题交给这组 AI。默认处理项目分析和部署缺项；调整不会授权 AI 执行服务器命令。
help.field.applicationId=程序保存的应用标识，通常从应用列表选择后自动填入。只有需要定位特定应用时才手动修改。
