db.nativeEndpoint=项目声明了外部或尚未确定的 DB 地址。是否在本次部署服务器上使用相同类型的 DB，并替换应用连接配置？选择“否”停止任务；如需继续使用原数据库，请在高级选项中填写明确的外部 DB 绑定。
db.manualRequired=等待人工处理数据库，本次未交付成功部署。请先在服务器完成恢复，再使用相同项目重新启动部署；程序会先检查已保存的数据库操作记录，不能直接重复初始化。

