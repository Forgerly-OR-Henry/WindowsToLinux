auto.serverSaved=保存并检查连接
help.field.healthMode=首页默认根据项目类型和声明自动选择；手工组件需明确选择。覆盖识别结果时，网页选择 HTTP，监听端口选择 TCP；检查方式不符会阻止发布。
help.field.healthEndpoint=HTTP 填服务器上的检查地址，TCP 填监听端口。自动部署留空时使用项目端口和本机根路径，手工组件需填写。仅在实际监听位置不同时修改；检查失败会阻止发布。
help.field.expectedStatus=HTTP 检查期望的状态码，默认 200。只有应用健康接口使用其他状态码时才修改。
help.field.timeout=每次健康检查允许等待的秒数，首页默认 10，手工组件默认 20。启动较慢时可适当增加；过短可能误判失败。
help.field.tcpStability=TCP 端口需要连续稳定的秒数，首页默认 5，手工组件默认 1。启动不稳定时可增加，避免端口短暂打开后退出却被当成成功。
help.field.userAccessUrl=部署后供人访问的网址。自动 HTTP 部署留空时使用服务器地址和项目端口；有域名或反向代理时修改，手工 HTTP 组件需填写。TCP 服务保持空白。
help.field.projectType=指定程序类型。自动部署通常根据源码识别，只有存在多种可用部署方式时才需要你选择。
help.field.runtimePrimary=运行时的主要参数，例如 JAR 路径、Python 版本或静态站点输出目录。优先使用源码中识别出的值。
help.field.runtimeSecondary=运行入口，例如 Java 主类或 Python 模块名。具体含义取决于项目类型，无需此项的类型保持空白。
help.field.runtimeVersion=项目需要的运行时版本。优先使用项目明确声明的版本，不要为了追求最新版随意修改。
help.field.jvmArguments=传给 Java 虚拟机的参数，例如内存限制。没有额外要求时留空，各参数按界面支持的记法分开。
help.field.applicationArguments=传给应用的启动参数，不是可以任意执行的 Shell。没有额外启动参数时留空。
help.field.containerEngine=仅容器项目使用，默认 Podman。需要 Docker 且服务器支持时才修改；Docker 的额外权限风险需单独确认。
help.field.containerPorts=容器项目的宿主端口与容器端口映射，例如 8080:80。端口必须与服务一致且不能冲突。
help.field.containerVolumes=容器持久化目录映射。只允许受管位置；无持久化需求时留空，切勿把服务器任意目录填入。
help.field.configurationEntries=应用的普通配置项，例如 PORT=8080。密码不要写在这里，应使用秘密引用。留空使用项目默认配置。
help.field.databaseReviewMode=默认“未审阅”。首页会继续按源码自动管理 DB；手工组件必须完成审阅。已有明确连接时可选择类型并填详情，无数据库可选“无”；不得遗漏源码声明的数据库。
help.field.databaseDetails=已有数据库的连接位置、库名、用户和秘密引用。自动管理或无 DB 时留空；手工绑定时按提示格式填写，错误位置会阻止连接。这里不填明文密码。
help.field.secretReferences=应用需要的已保存秘密及修订编号。无额外秘密时留空，需要注入秘密时填写引用；错误修订会阻止部署，不要填写密码、Token 或私钥。
help.field.secretRevision=将应用密码保存到安全存储后获得引用。只有应用需要秘密配置时才使用。
help.rootBuild=使用 root 编译源码会给予构建更高权限。默认关闭，每次开启部署都需要单独确认。
help.experimentalAdapterRisk=允许试验中的运行时适配器，仅在了解支持范围的测试环境使用。默认不允许。

auto.detectType=自动识别项目类型
help.auto.detectType=默认按项目声明识别类型。只有明确知道运行方式时才关闭并手动选择，错误类型可能导致构建失败。
