<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1570" viewBox="0 0 1400 1570">
<rect width="100%" height="100%" fill="white"/>
<rect x="220" y="50" width="960" height="155" fill="white" stroke="#222" stroke-width="4"/>
<text x="700" y="105" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">来源与目标</text>
<text x="700" y="167" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">本地源码或固定 Git 版本</text>
<polyline points="700,205 700,280" fill="none" stroke="#333" stroke-width="4"/>
<polygon points="700.00,280.00 691.03,259.91 708.97,259.91" fill="#333"/>
<rect x="220" y="280" width="960" height="155" fill="white" stroke="#222" stroke-width="4"/>
<text x="700" y="335" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">识别组件并审阅参数</text>
<text x="700" y="397" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">补齐必要输入</text>
<polyline points="700,435 700,510" fill="none" stroke="#333" stroke-width="4"/>
<polygon points="700.00,510.00 691.03,489.91 708.97,489.91" fill="#333"/>
<rect x="220" y="510" width="960" height="155" fill="#f5f5f5" stroke="#222" stroke-width="4"/>
<text x="700" y="565" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">冻结任务策略</text>
<text x="700" y="627" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">下载用途 来源顺序 校验依据</text>
<polyline points="700,665 700,740" fill="none" stroke="#333" stroke-width="4"/>
<polygon points="700.00,740.00 691.03,719.91 708.97,719.91" fill="#333"/>
<rect x="220" y="740" width="960" height="155" fill="white" stroke="#222" stroke-width="4"/>
<text x="700" y="795" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">受控准备与构建</text>
<text x="700" y="857" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">失败仅沿原冻结链处理</text>
<polyline points="700,895 700,970" fill="none" stroke="#333" stroke-width="4"/>
<polygon points="700.00,970.00 691.03,949.91 708.97,949.91" fill="#333"/>
<rect x="220" y="970" width="960" height="155" fill="white" stroke="#222" stroke-width="4"/>
<text x="700" y="1025" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">候选发布与健康检查</text>
<text x="700" y="1087" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">失败按原状态清理或恢复</text>
<polyline points="700,1125 700,1200" fill="none" stroke="#333" stroke-width="4"/>
<polygon points="700.00,1200.00 691.03,1179.91 708.97,1179.91" fill="#333"/>
<rect x="220" y="1200" width="960" height="155" fill="white" stroke="#222" stroke-width="4"/>
<text x="700" y="1255" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">保存原任务回执</text>
<text x="700" y="1317" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="46" fill="#111">业务正确性另行验证</text>
<polyline points="1180,1278 1285,1278 1285,587 1180,587" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="11 9"/>
<polygon points="1180.00,587.00 1200.09,578.03 1200.09,595.97" fill="#333"/>
<rect x="1215" y="805" width="140" height="200" fill="white"/>
<text x="1285" y="840" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="38" fill="#111">恢复</text>
<text x="1285" y="891" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="38" fill="#111">读取</text>
<text x="1285" y="942" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="38" fill="#111">原快照</text>
<text x="98" y="1050" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="35" fill="#111">结果未知</text>
<text x="98" y="1097" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="35" fill="#111">核查原任务</text>
<text x="98" y="1144" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="35" fill="#111">不自动重放</text>
<polyline points="220,1047 210,1047 210,1278 220,1278" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="11 9"/>
<polygon points="220.00,1278.00 199.91,1286.97 199.91,1269.03" fill="#333"/>
<text x="700" y="1490" text-anchor="middle" dominant-baseline="central" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="43" fill="#111">确认结果后再继续原任务</text>
</svg>